<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harshad's Movie Vault</title>
<style>
:root{
  --bg:#0e0c10; --bg-panel:#17141a; --bg-card:#1e1a22;
  --gold:#d9a441; --gold-dim:#8a6a2c; --marquee-red:#b4483c; --green:#6fae6f;
  --text:#f1ece0; --text-dim:#a49c8f; --line:#2c2731;
  --font-display:'Georgia','Times New Roman',serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'Courier New',monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);
  background-image:radial-gradient(circle at 15% 0%, rgba(217,164,65,0.07), transparent 40%),
    radial-gradient(circle at 85% 20%, rgba(180,72,60,0.06), transparent 45%);
  color:var(--text);font-family:var(--font-body);min-height:100vh;}

.logo-container {
  position: absolute;
  top: 20px;
  left: 20px;
  width: 60px;
  height: 60px;
  z-index: 100;
}
.logo-container img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 8px;
}

.header{padding:40px 24px 24px;text-align:center;border-bottom:1px solid var(--line);position:relative;}
.header::before,.header::after{content:"";position:absolute;top:0;bottom:0;width:14px;
  background-image:repeating-linear-gradient(to bottom,#000 0px,#000 10px,transparent 10px,transparent 20px);opacity:0.35;}
.header::before{left:0;} .header::after{right:0;}
h1{font-family:var(--font-display);font-size:clamp(26px,5vw,40px);margin:0 0 6px;color:var(--gold);font-weight:700;}
.subtitle{color:var(--text-dim);font-size:13px;max-width:560px;margin:0 auto;line-height:1.5;}
.stats{display:flex;justify-content:center;gap:24px;margin-top:16px;flex-wrap:wrap;}
.stat{text-align:center;} .stat-num{font-family:var(--font-display);font-size:22px;color:var(--gold);}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);}

.tabs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:18px 16px;
  border-bottom:1px solid var(--line);background:var(--bg-panel);position:sticky;top:0;z-index:30;}
.tab-btn{font-family:var(--font-mono);font-size:12px;background:transparent;border:1px solid var(--line);
  color:var(--text-dim);padding:8px 14px;border-radius:3px;cursor:pointer;transition:all .15s;}
.tab-btn:hover{border-color:var(--gold-dim);color:var(--text);}
.tab-btn.active{background:var(--gold);border-color:var(--gold);color:#1a1408;font-weight:700;}

/* Layout with Sidebar */
.app-container {
  display: flex;
  max-width: 1200px;
  margin: 0 auto;
  align-items: flex-start;
}
.sidebar {
  width: 240px;
  padding: 20px;
  position: sticky;
  top: 75px;
  height: calc(100vh - 75px);
  overflow-y: auto;
  border-right: 1px solid var(--line);
  display: none; /* Shown only on movies/series tabs */
}
.sidebar-title {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--gold-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 15px;
}
.sidebar-list { list-style: none; padding: 0; margin: 0 0 20px 0; }
.sidebar-list li {
  font-size: 13px;
  color: var(--text-dim);
  padding: 6px 10px;
  cursor: pointer;
  border-radius: 4px;
  transition: background 0.15s, color 0.15s;
}
.sidebar-list li:hover { background: var(--bg-card); color: var(--text); }
.sidebar-list li.active { background: var(--gold); color: #1a1408; font-weight: bold; }

.main-content {
  flex: 1;
  padding: 20px;
  min-width: 0;
}

.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center; margin-bottom: 20px;}
.controls input[type=text]{background:var(--bg-card);border:1px solid var(--line);color:var(--text);
  padding:8px 12px;border-radius:4px;font-size:13px;flex:1;min-width:180px;}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);cursor:pointer;}
.btn-add-manual { font-family:var(--font-mono);font-size:11px;background:var(--green);border:none;color:#1a1408;padding:8px 14px;border-radius:3px;cursor:pointer;font-weight:700;display:none; }

.genre-section{margin-bottom:34px;}
.genre-title{font-family:var(--font-display);font-size:22px;color:var(--gold);border-bottom:1px solid var(--gold-dim);
  padding-bottom:7px;margin-bottom:16px;display:flex;align-items:baseline;gap:10px;}
.genre-title .count{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);}
.time-block{margin-bottom:20px;margin-left:4px;}
.time-title{font-family:var(--font-mono);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--marquee-red);margin-bottom:9px;padding-left:10px;border-left:2px solid var(--marquee-red);}
.lang-group{margin-bottom:12px;margin-left:14px;}
.lang-title{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}

.card{background:var(--bg-card);border:1px solid var(--line);border-radius:6px;padding:0;
  transition:border-color .15s, transform .15s; position:relative; display:flex; flex-direction:column; overflow:hidden;}
.card:hover{border-color:var(--gold-dim);transform:translateY(-2px);}
.card.watched{opacity:0.55;}
.card-poster { width: 100%; height: 140px; object-fit: cover; border-bottom: 1px solid var(--line); background:#111; }
.card-body { padding: 12px 14px; display:flex; flex-direction:column; flex:1; }
.card-header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;}
.card-title{font-weight:600;font-size:14px;line-height:1.3; flex:1;}
.card-title a{color:inherit;text-decoration:none;}
.card-title a:hover{color:var(--gold);}
.card-year{color:var(--text-dim);font-size:12px;margin-top:2px;}
.card-note{font-size:11px;color:var(--marquee-red);margin-top:6px;font-style:italic;}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto; padding-top:10px;}
.card-link{font-size:11px;color:var(--gold-dim);text-decoration:none;}
.card-link:hover{color:var(--gold);}

.watch-btn{font-family:var(--font-mono);font-size:10px;background:transparent;border:1px solid var(--line);
  color:var(--text-dim);padding:2px 6px;border-radius:3px;cursor:pointer; white-space:nowrap;}
.watch-btn.on{background:var(--green); border-color:var(--green);color:#111; font-weight:bold;}
.watch-btn:hover{border-color:var(--green);color:var(--green);}
.watch-btn.on:hover{color:#111;}

.empty-msg{color:var(--text-dim);font-size:13px;padding:20px;text-align:center;}
.section-note{color:var(--text-dim);font-size:13px;line-height:1.6;margin-bottom:20px;
  background:var(--bg-panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;}
.section-note b{color:var(--text);}

.unid-list{display:flex;flex-direction:column;gap:10px;}
.unid-item{background:var(--bg-card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;}
.unid-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;}
.unid-note{color:var(--text-dim);font-size:13px;flex:1;min-width:220px;}
.unid-item > .unid-top > a{color:var(--gold-dim);font-family:var(--font-mono);font-size:12px;white-space:nowrap;text-decoration:none;}
.unid-item > .unid-top > a:hover{color:var(--gold);}
.resolve-btn{font-family:var(--font-mono);font-size:11px;background:transparent;border:1px solid var(--gold-dim);
  color:var(--gold-dim);padding:6px 12px;border-radius:3px;cursor:pointer;margin-top:8px;}
.resolve-btn:hover{border-color:var(--gold);color:var(--gold);}

.resolve-form{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;display:none;}
.resolve-form.open{display:block;}
.entry-row{display:grid;grid-template-columns:1.6fr 0.7fr 1fr 1fr 1fr;gap:6px;margin-bottom:8px;align-items:center;}
.entry-row input, .entry-row select{background:var(--bg);border:1px solid var(--line);color:var(--text);
  padding:6px 8px;border-radius:4px;font-size:12px;width:100%;}
.type-toggle{display:flex;gap:8px;margin-bottom:10px;}
.type-toggle label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-dim);cursor:pointer;}
.form-actions{display:flex;gap:8px;margin-top:10px;}
.btn-primary{font-family:var(--font-mono);font-size:11px;background:var(--gold);border:none;color:#1a1408;
  padding:7px 14px;border-radius:3px;cursor:pointer;font-weight:700;}
.btn-secondary{font-family:var(--font-mono);font-size:11px;background:transparent;border:1px solid var(--line);
  color:var(--text-dim);padding:7px 14px;border-radius:3px;cursor:pointer;}
.add-row-btn{font-family:var(--font-mono);font-size:11px;background:transparent;border:1px dashed var(--line);
  color:var(--text-dim);padding:6px 10px;border-radius:3px;cursor:pointer;margin-bottom:8px;}
.add-row-btn:hover{border-color:var(--gold-dim);color:var(--gold-dim);}
.lookup-btn{background:var(--bg-card);border:1px solid var(--line);color:var(--gold-dim);border-radius:4px;padding:0 10px;cursor:pointer;font-size:14px;}
.lookup-btn:hover{border-color:var(--gold);color:var(--gold);}
.lookup-status{font-size:10px;margin-top:3px;min-height:12px;}
.field-label{font-size:9px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-dim);margin-bottom:2px;}

#manualAddModal { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--bg-panel); padding:20px; border:1px solid var(--gold); border-radius:8px; z-index:200; width:90%; max-width:800px; display:none; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
.overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:150; display:none; }

footer{text-align:center;padding:30px 20px 50px;color:var(--text-dim);font-size:11px;font-family:var(--font-mono);}
.loading{text-align:center;padding:60px;color:var(--text-dim);}
</style>
</head>
<body>

<div class="logo-container">
  <!-- Ensure image_4d893c.jpg is in the same directory as this file -->
  <img src="image_4d893c.jpg" alt="Logo">
</div>

<div class="header">
  <h1>The Movie Vault</h1>
  <div class="subtitle">Where your movie life is organized.</div>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="statMovies">-</div><div class="stat-label">Movies</div></div>
    <div class="stat"><div class="stat-num" id="statSeries">-</div><div class="stat-label">Series</div></div>
    <div class="stat"><div class="stat-num" id="statUnid">-</div><div class="stat-label">Needs Review</div></div>
    <div class="stat"><div class="stat-num" id="statWatched">-</div><div class="stat-label">Watched</div></div>
  </div>
</div>

<div class="tabs" id="tabs"></div>

<div class="app-container">
  <aside class="sidebar" id="sidebar"></aside>
  
  <main class="main-content">
    <div class="controls">
      <input type="text" id="searchBox" placeholder="Search title, language, genre...">
      <label class="chk"><input type="checkbox" id="hideWatched"> Hide watched</label>
      <button class="btn-add-manual" id="btnManualAdd" onclick="openManualAdd()">+ Add Entry</button>
    </div>
    
    <div id="main-view"><div class="loading">Loading your vault…</div></div>
  </main>
</div>

<!-- Manual Add Modal -->
<div class="overlay" id="modalOverlay" onclick="closeManualAdd()"></div>
<div id="manualAddModal">
  <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
    <h3 style="margin:0; color:var(--gold);">Add New Entry</h3>
    <button onclick="closeManualAdd()" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;">&times;</button>
  </div>
  <div class="resolve-form open" id="form-manual">
    <div class="type-toggle">
      <label><input type="radio" name="type-manual" value="movie" checked> Movie</label>
      <label><input type="radio" name="type-manual" value="series"> Series</label>
    </div>
    <div id="rows-manual"></div>
    <div class="form-actions">
      <button class="btn-primary" onclick="submitManualAdd()">Save to Vault</button>
      <button class="btn-secondary" onclick="closeManualAdd()">Cancel</button>
    </div>
  </div>
</div>

<div id="loginBox" style="display:none;max-width:320px;margin:20px auto 0;padding:16px;background:var(--bg-panel);border:1px solid var(--line);border-radius:6px;">
  <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;">Admin Sign In</div>
  <input type="email" id="adminEmail" placeholder="Email" style="width:100%;margin-bottom:8px;background:var(--bg-card);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:4px;font-size:13px;">
  <input type="password" id="adminPass" placeholder="Password" style="width:100%;margin-bottom:8px;background:var(--bg-card);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:4px;font-size:13px;">
  <div id="loginStatus" style="font-size:11px;margin-bottom:8px;min-height:14px;"></div>
  <button class="btn-primary" onclick="adminLogin()" style="width:100%;">Sign In</button>
</div>
<footer>
  <span id="adminBadge" style="display:none;color:var(--green);">Admin mode &middot; <a href="#" onclick="adminLogout();return false;" style="color:var(--gold-dim);">Sign out</a> &middot; </span>
  <a href="#" onclick="document.getElementById('loginBox').style.display = document.getElementById('loginBox').style.display==='none'?'block':'none'; return false;" style="color:var(--text-dim);text-decoration:none;" id="adminToggleLink">Admin</a>
</footer>

<script>
// Base Seed Data from your previous chat (reduced here for space, logic remains intact)
const SEED = {"movies": [{"title": "Dead Poets Society", "year": "1989", "genre": "Drama", "language": "English", "time": "Rainy Day / Cozy", "url": "https://www.instagram.com/reel/DTQTnqNCGsW/", "note": "", "subgenre": "Drama", "watched": false, "type": "movie", "id": "m0", "poster":""}], "series": [], "unidentified": []};
const OMDB_KEY = 'fbc474e6';

let DATA = null;
let activeTab = 'movies';
let query = '';
let hideWatched = false;
let openResolveId = null;
let selectedGenreFilter = 'All'; 

let db = null;
let docRef = null;
let auth = null;
let isAdmin = false;

async function initFirebase(){
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const { getFirestore, doc, getDoc, setDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
  const firebaseConfig = {
    apiKey: "AIzaSyCENX28G1ilQiZiLwjCY3AF7oPCelj9UsQ",
    authDomain: "movie-collections-d9103.firebaseapp.com",
    projectId: "movie-collections-d9103",
    storageBucket: "movie-collections-d9103.firebasestorage.app",
    messagingSenderId: "415085699584",
    appId: "1:415085699584:web:c98f6eb2fd3ea061c7eee5",
    measurementId: "G-Y0FS0S4XT3"
  };
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  docRef = doc(db, "vault", "main");
  auth = getAuth(app);
  window._fs = { getDoc, setDoc, doc };
  window._auth = { signInWithEmailAndPassword, signOut, onAuthStateChanged };
  onAuthStateChanged(auth, (user)=>{
    isAdmin = !!user;
    updateAdminUI();
    render();
  });
}

async function adminLogin(){
  const email = document.getElementById('adminEmail').value.trim();
  const pass = document.getElementById('adminPass').value;
  const statusEl = document.getElementById('loginStatus');
  statusEl.textContent = 'Signing in...'; statusEl.style.color = 'var(--text-dim)';
  try{
    await window._auth.signInWithEmailAndPassword(auth, email, pass);
    statusEl.textContent = '';
    document.getElementById('loginBox').style.display = 'none';
  }catch(e){
    statusEl.textContent = 'Login failed — check email/password';
    statusEl.style.color = 'var(--marquee-red)';
  }
}

async function adminLogout(){
  await window._auth.signOut(auth);
}

function updateAdminUI(){
  const badge = document.getElementById('adminBadge');
  const btnAdd = document.getElementById('btnManualAdd');
  if(badge) badge.style.display = isAdmin ? 'inline-block' : 'none';
  if(btnAdd) btnAdd.style.display = isAdmin ? 'inline-block' : 'none';
}

async function loadData(){
  const main = document.getElementById('main-view');
  try{
    await initFirebase();
    const snap = await window._fs.getDoc(docRef);
    if(snap.exists()){
      DATA = snap.data();
    } else {
      DATA = JSON.parse(JSON.stringify(SEED));
      await save();
    }
  }catch(e){
    console.error('Firebase load failed', e);
    DATA = JSON.parse(JSON.stringify(SEED));
    main.innerHTML = '<div class="section-note" style="color:var(--marquee-red)">Could not connect to Firebase — changes won\'t sync.</div>' + main.innerHTML;
  }
  render();
}

async function save(){
  if(!isAdmin) return;
  try{ await window._fs.setDoc(docRef, DATA); }catch(e){ console.error('save failed', e); }
}

function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function allGenres(){
  const g = new Set();
  if(activeTab === 'movies') DATA.movies.forEach(m=>g.add(m.genre));
  if(activeTab === 'series') DATA.series.forEach(s=>g.add(s.genre));
  return [...g].filter(Boolean).sort();
}

function matchesQuery(obj, fields){
  if(!query) return true;
  const q = query.toLowerCase();
  return fields.some(f => (obj[f]||'').toLowerCase().includes(q));
}

function renderStats(){
  document.getElementById('statMovies').textContent = DATA.movies.length;
  document.getElementById('statSeries').textContent = DATA.series.length;
  if(DATA.unidentified) document.getElementById('statUnid').textContent = DATA.unidentified.filter(u=>!u.resolved).length;
  document.getElementById('statWatched').textContent = DATA.movies.filter(m=>m.watched).length + DATA.series.filter(s=>s.watched).length;
}

function renderTabs(){
  const tabs = [
    {id:'movies', label:'Movies'},
    {id:'series', label:'Series'},
  ];
  if(isAdmin && DATA.unidentified){
    tabs.push({id:'unidentified', label:'Needs Review ('+DATA.unidentified.filter(u=>!u.resolved).length+')'});
  }
  if(activeTab==='unidentified' && !isAdmin) activeTab='movies';
  const el = document.getElementById('tabs');
  el.innerHTML = tabs.map(t => `<button class="tab-btn ${t.id===activeTab?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('');
  el.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeTab = btn.dataset.tab; openResolveId=null; selectedGenreFilter='All'; render(); });
  });
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  if(activeTab === 'unidentified') {
    sidebar.style.display = 'none';
    return;
  }
  sidebar.style.display = 'block';
  
  const genres = allGenres();
  let html = `<div class="sidebar-title">Filter by Genre</div><ul class="sidebar-list">`;
  html += `<li class="${selectedGenreFilter==='All'?'active':''}" onclick="setGenreFilter('All')">All Genres</li>`;
  genres.forEach(g => {
    html += `<li class="${selectedGenreFilter===g?'active':''}" onclick="setGenreFilter('${g}')">${g}</li>`;
  });
  html += `</ul>`;
  sidebar.innerHTML = html;
}

function setGenreFilter(genre) {
  selectedGenreFilter = genre;
  render();
}

function toggleWatched(type, id){
  if(!isAdmin){ alert('Sign in as admin to make changes.'); return; }
  const arr = type==='movie' ? DATA.movies : DATA.series;
  const item = arr.find(x=>x.id===id);
  if(item){ item.watched = !item.watched; save(); renderStats(); render(); }
}

function movieCard(m, type){
  const watchedClass = m.watched ? 'watched' : '';
  const watchControl = isAdmin
    ? `<button class="watch-btn ${m.watched?'on':''}" onclick="toggleWatched('${type}','${m.id}')">${m.watched?'✓ Watched':'Mark'}</button>`
    : (m.watched ? `<span class="watch-btn on" style="cursor:default;">✓</span>` : '');
    
  const posterHtml = m.poster && m.poster !== 'N/A' 
    ? `<img src="${m.poster}" class="card-poster" alt="${m.title} poster" loading="lazy">` 
    : `<div class="card-poster" style="display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:11px;">No Poster</div>`;

  return `<div class="card ${watchedClass}">
      ${posterHtml}
      <div class="card-body">
        <div class="card-header-row">
          <div class="card-title"><a href="${m.url||'#'}" target="${m.url?'_blank':''}" rel="noopener">${m.title}</a></div>
          ${watchControl}
        </div>
        <div class="card-year">${m.year? m.year+' &middot; ':''}${m.subgenre||''}</div>
        ${m.note ? `<div class="card-note">${m.note}</div>` : ''}
        <div class="card-foot">
          ${m.url ? `<a class="card-link" href="${m.url}" target="_blank" rel="noopener">View Post &rarr;</a>` : '<span></span>'}
        </div>
      </div>
    </div>`;
}

function renderMovies(){
  const main = document.getElementById('main-view');
  let filtered = DATA.movies.filter(m => matchesQuery(m, ['title','genre','language','subgenre','time']));
  if(hideWatched) filtered = filtered.filter(m=>!m.watched);
  if(selectedGenreFilter !== 'All') filtered = filtered.filter(m=>m.genre === selectedGenreFilter);
  
  if(filtered.length===0){ main.innerHTML = '<div class="empty-msg">No matches.</div>'; return; }

  const genres = [...new Set(filtered.map(m=>m.genre))].sort();
  let html = '';
  genres.forEach(genre=>{
    const genreMovies = filtered.filter(m=>m.genre===genre);
    html += `<div class="genre-section"><div class="genre-title">${genre} <span class="count">${genreMovies.length} titles</span></div>`;
    const times = [...new Set(genreMovies.map(m=>m.time||'Unspecified'))].sort();
    times.forEach(time=>{
      const timeMovies = genreMovies.filter(m=>(m.time||'Unspecified')===time);
      html += `<div class="time-block"><div class="time-title">${time}</div>`;
      const langs = [...new Set(timeMovies.map(m=>m.language))].sort();
      langs.forEach(lang=>{
        const langMovies = timeMovies.filter(m=>m.language===lang);
        html += `<div class="lang-group"><div class="lang-title">${lang}</div><div class="card-grid">`;
        langMovies.forEach(m=>{ html += movieCard(m,'movie'); });
        html += `</div></div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  });
  main.innerHTML = html;
}

function renderSeries(){
  const main = document.getElementById('main-view');
  let filtered = DATA.series.filter(s => matchesQuery(s, ['title','genre','language','subgenre']));
  if(hideWatched) filtered = filtered.filter(s=>!s.watched);
  if(selectedGenreFilter !== 'All') filtered = filtered.filter(m=>m.genre === selectedGenreFilter);

  let html = '';
  if(filtered.length===0){ html += '<div class="empty-msg">No matches.</div>'; main.innerHTML = html; return; }
  
  const genres = [...new Set(filtered.map(s=>s.genre))].sort();
  genres.forEach(genre=>{
    const genreSeries = filtered.filter(s=>s.genre===genre);
    html += `<div class="genre-section"><div class="genre-title">${genre} <span class="count">${genreSeries.length}</span></div>`;
    const langs = [...new Set(genreSeries.map(s=>s.language))].sort();
    langs.forEach(lang=>{
      const langSeries = genreSeries.filter(s=>s.language===lang);
      html += `<div class="lang-group"><div class="lang-title">${lang}</div><div class="card-grid">`;
      langSeries.forEach(s=>{ html += movieCard(s,'series'); });
      html += `</div></div>`;
    });
    html += `</div>`;
  });
  main.innerHTML = html;
}

function entryRowHtml(idx){
  return `<div class="entry-row" data-idx="${idx}">
    <div>
      <div class="field-label">Title</div>
      <div style="display:flex;gap:4px;">
        <input type="text" class="f-title" placeholder="Movie / show name" style="flex:1;">
        <button type="button" class="lookup-btn" onclick="lookupOMDb(this)" title="Auto-fill year/genre/poster">&#8635;</button>
      </div>
      <div class="lookup-status"></div>
    </div>
    <div><div class="field-label">Year</div><input type="text" class="f-year" placeholder="2024"></div>
    <div><div class="field-label">Genre</div><input type="text" class="f-genre" placeholder="e.g. Drama"></div>
    <div><div class="field-label">Language</div><input type="text" class="f-lang" placeholder="e.g. Hindi"></div>
    <div><div class="field-label">Best Time (Movie)</div><input type="text" class="f-time" placeholder="e.g. Late Night"></div>
    <input type="hidden" class="f-poster" value="">
  </div>`;
}

async function lookupOMDb(btn){
  const row = btn.closest('.entry-row');
  const titleInput = row.querySelector('.f-title');
  const statusEl = row.querySelector('.lookup-status');
  const title = titleInput.value.trim();
  if(!title){ statusEl.textContent = 'Type a title first'; statusEl.style.color = 'var(--marquee-red)'; return; }
  statusEl.textContent = 'Looking up…'; statusEl.style.color = 'var(--text-dim)';
  btn.disabled = true;
  try{
    const url = `https://www.omdbapi.com/?t=${encodeURIComponent(title)}&apikey=${OMDB_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.Response === 'False'){
      statusEl.textContent = 'Not found — enter manually';
      statusEl.style.color = 'var(--marquee-red)';
    } else {
      row.querySelector('.f-year').value = (data.Year||'').split(/[–-]/)[0];
      const genre = (data.Genre||'').split(',')[0].trim();
      if(genre) row.querySelector('.f-genre').value = genre;
      
      const poster = (data.Poster !== 'N/A') ? data.Poster : '';
      row.querySelector('.f-poster').value = poster;

      const langMap = {'English':'English','Hindi':'Hindi','Tamil':'Tamil','Telugu':'Telugu'};
      const lang = (data.Language||'').split(',')[0].trim();
      row.querySelector('.f-lang').value = langMap[lang] || lang || '';
      
      titleInput.value = data.Title;
      statusEl.textContent = `Found: ${data.Title} (${data.Year})`;
      statusEl.style.color = 'var(--green)';
    }
  }catch(e){
    statusEl.textContent = 'Lookup failed — fill manually';
    statusEl.style.color = 'var(--marquee-red)';
  }
  btn.disabled = false;
}

function renderUnidentified(){
  if(!DATA.unidentified) return;
  const main = document.getElementById('main-view');
  const filtered = DATA.unidentified.filter(u=>!u.resolved).filter(u => matchesQuery(u, ['note']));
  let html = `<div class="section-note"><b>${filtered.length} posts</b> need review. Admin only.</div>`;
  html += `<div class="unid-list">`;
  filtered.forEach(u=>{
    const isOpen = openResolveId===u.id;
    html += `<div class="unid-item" id="item-${u.id}">
      <div class="unid-top">
        <span class="unid-note">${u.note}</span>
        <a href="${u.url}" target="_blank" rel="noopener">Open post &rarr;</a>
      </div>
      <button class="resolve-btn" onclick="openResolve('${u.id}')">${isOpen?'Cancel':'I found it — resolve'}</button>
      <div class="resolve-form ${isOpen?'open':''}" id="form-${u.id}">
        <div class="type-toggle">
          <label><input type="radio" name="type-${u.id}" value="movie" checked> Movie</label>
          <label><input type="radio" name="type-${u.id}" value="series"> Series</label>
        </div>
        <div id="rows-${u.id}">${entryRowHtml(0)}</div>
        <div class="form-actions">
          <button class="btn-primary" onclick="submitResolve('${u.id}')">Save to Vault</button>
        </div>
      </div>
    </div>`;
  });
  html += `</div>`;
  main.innerHTML = html;
}

function openResolve(id){
  openResolveId = (openResolveId===id) ? null : id;
  render();
}

function openManualAdd() {
  document.getElementById('modalOverlay').style.display = 'block';
  document.getElementById('manualAddModal').style.display = 'block';
  document.getElementById('rows-manual').innerHTML = entryRowHtml(0);
}

function closeManualAdd() {
  document.getElementById('modalOverlay').style.display = 'none';
  document.getElementById('manualAddModal').style.display = 'none';
}

function submitManualAdd() {
  if(!isAdmin) return;
  const typeEl = document.querySelector(`input[name="type-manual"]:checked`);
  const type = typeEl ? typeEl.value : 'movie';
  const row = document.querySelector(`#rows-manual .entry-row`);
  
  const title = row.querySelector('.f-title').value.trim();
  if(!title) { alert('Title is required'); return; }
  
  const entry = {
    id: uid(type==='movie'?'m':'s'),
    title, 
    year: row.querySelector('.f-year').value.trim(),
    genre: row.querySelector('.f-genre').value.trim() || 'Uncategorized',
    language: row.querySelector('.f-lang').value.trim() || 'Unknown',
    time: type==='movie' ? row.querySelector('.f-time').value.trim() : '',
    poster: row.querySelector('.f-poster').value,
    url: '', note: 'Manually Added', watched: false, type
  };
  
  if(type==='movie') DATA.movies.push(entry); else DATA.series.push(entry);
  save();
  renderStats();
  render();
  closeManualAdd();
}

function submitResolve(id){
  if(!isAdmin) return;
  const item = DATA.unidentified.find(u=>u.id===id);
  if(!item) return;
  const typeEl = document.querySelector(`input[name="type-${id}"]:checked`);
  const type = typeEl ? typeEl.value : 'movie';
  const row = document.querySelector(`#rows-${id} .entry-row`);
  
  const title = row.querySelector('.f-title').value.trim();
  if(!title) return;
  
  const entry = {
    id: uid(type==='movie'?'m':'s'),
    title, 
    year: row.querySelector('.f-year').value.trim(), 
    genre: row.querySelector('.f-genre').value.trim() || 'Uncategorized',
    language: row.querySelector('.f-lang').value.trim() || 'Unknown',
    time: type==='movie' ? row.querySelector('.f-time').value.trim() : '',
    poster: row.querySelector('.f-poster').value,
    url: item.url, note:'', watched:false, type
  };
  
  if(type==='movie') DATA.movies.push(entry); else DATA.series.push(entry);
  item.resolved = true;
  openResolveId = null;
  save();
  renderStats();
  render();
}

function render(){
  renderTabs();
  renderSidebar();
  renderStats();
  if(activeTab==='movies') renderMovies();
  else if(activeTab==='series') renderSeries();
  else renderUnidentified();
}

document.getElementById('searchBox').addEventListener('input', (e)=>{ query = e.target.value; render(); });
document.getElementById('hideWatched').addEventListener('change', (e)=>{ hideWatched = e.target.checked; render(); });

loadData();
</script>
</body>
</html>
