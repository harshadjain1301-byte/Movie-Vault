<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harshad's Movie Vault</title>
<style>
:root{
  --bg:#0e0c10; --bg-panel:#17141a; --bg-card:#1e1a22;
  --gold:#d9a441; --gold-dim:#8a6a2c; --marquee-red:#b4483c; --green:#6fae6f;
  --text:#f1ece0; --text-dim:#a49c8f; --line:#2c2731;
  --font-display:'Georgia','Times New Roman',serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'Courier New',monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg); background-image:radial-gradient(circle at 15% 0%, rgba(217,164,65,0.07), transparent 40%), radial-gradient(circle at 85% 20%, rgba(180,72,60,0.06), transparent 45%); color:var(--text);font-family:var(--font-body);min-height:100vh;}

/* Top Bar & Auth */
.top-bar { position: absolute; top: 20px; left: 20px; display: flex; align-items: center; gap: 15px; z-index: 100; }
.logo-container { width: 50px; height: 50px; }
.logo-container img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }
.auth-container { display: flex; gap: 12px; align-items: center; font-family: var(--font-mono); font-size: 12px; }
.auth-link { color: var(--gold-dim); text-decoration: none; cursor: pointer; transition: color 0.15s; }
.auth-link:hover { color: var(--gold); }
.user-badge { color: var(--text); font-weight: bold; background: var(--bg-card); padding: 4px 10px; border: 1px solid var(--line); border-radius: 4px; }
.fav-toggle.active { color: var(--green); font-weight: bold; }

.header{padding:60px 24px 24px;text-align:center;border-bottom:1px solid var(--line);position:relative;}
.header::before,.header::after{content:"";position:absolute;top:0;bottom:0;width:14px; background-image:repeating-linear-gradient(to bottom,#000 0px,#000 10px,transparent 10px,transparent 20px);opacity:0.35;}
.header::before{left:0;} .header::after{right:0;}
h1{font-family:var(--font-display);font-size:clamp(26px,5vw,40px);margin:0 0 6px;color:var(--gold);font-weight:700;}
.subtitle{color:var(--text-dim);font-size:13px;max-width:560px;margin:0 auto;line-height:1.5;}
.stats{display:flex;justify-content:center;gap:24px;margin-top:16px;flex-wrap:wrap;}
.stat{text-align:center;} .stat-num{font-family:var(--font-display);font-size:22px;color:var(--gold);}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);}

.tabs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:18px 16px; border-bottom:1px solid var(--line);background:var(--bg-panel);position:sticky;top:0;z-index:30;}
.tab-btn{font-family:var(--font-mono);font-size:12px;background:transparent;border:1px solid var(--line); color:var(--text-dim);padding:8px 14px;border-radius:3px;cursor:pointer;transition:all .15s;}
.tab-btn:hover{border-color:var(--gold-dim);color:var(--text);}
.tab-btn.active{background:var(--gold);border-color:var(--gold);color:#1a1408;font-weight:700;}
.tab-btn.notify{border-color:var(--green); color:var(--green);}

.app-container { display: flex; max-width: 1200px; margin: 0 auto; align-items: flex-start; }
.sidebar { width: 240px; padding: 20px; position: sticky; top: 75px; height: calc(100vh - 75px); overflow-y: auto; border-right: 1px solid var(--line); display: none; }
.sidebar-title { font-family: var(--font-mono); font-size: 11px; color: var(--gold-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
.sidebar-list { list-style: none; padding: 0; margin: 0 0 20px 0; }
.sidebar-list li { font-size: 13px; color: var(--text-dim); padding: 6px 10px; cursor: pointer; border-radius: 4px; transition: background 0.15s, color 0.15s; }
.sidebar-list li:hover { background: var(--bg-card); color: var(--text); }
.sidebar-list li.active { background: var(--gold); color: #1a1408; font-weight: bold; }

.main-content { flex: 1; padding: 20px; min-width: 0; }
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center; margin-bottom: 20px;}
.controls input[type=text]{background:var(--bg-card);border:1px solid var(--line);color:var(--text); padding:8px 12px;border-radius:4px;font-size:13px;flex:1;min-width:180px;}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);cursor:pointer;}
.btn-add-manual { font-family:var(--font-mono);font-size:11px;background:var(--green);border:none;color:#1a1408;padding:8px 14px;border-radius:3px;cursor:pointer;font-weight:700;display:none; }

.genre-section{margin-bottom:34px;}
.genre-title{font-family:var(--font-display);font-size:22px;color:var(--gold);border-bottom:1px solid var(--gold-dim); padding-bottom:7px;margin-bottom:16px;display:flex;align-items:baseline;gap:10px;}
.genre-title .count{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);}
.time-block{margin-bottom:20px;margin-left:4px;}
.time-title{font-family:var(--font-mono);font-size:12px;letter-spacing:1.5px;text-transform:uppercase; color:var(--marquee-red);margin-bottom:9px;padding-left:10px;border-left:2px solid var(--marquee-red);}
.lang-group{margin-bottom:12px;margin-left:14px;}
.lang-title{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}

.card{background:var(--bg-card);border:1px solid var(--line);border-radius:6px;padding:0; transition:border-color .15s, transform .15s; position:relative; display:flex; flex-direction:column; overflow:hidden; cursor:pointer;}
.card:hover{border-color:var(--gold-dim);transform:translateY(-2px);}
.card.watched-fade { opacity: 0.55; }
.card-poster { width: 100%; height: 160px; object-fit: cover; border-bottom: 1px solid var(--line); background:#111; }
.card-body { padding: 12px 14px; display:flex; flex-direction:column; flex:1; }
.card-title{font-weight:600;font-size:14px;line-height:1.3; margin-bottom:4px;}
.card-year{color:var(--text-dim);font-size:12px;}
.card-indicators { position:absolute; top:8px; right:8px; display:flex; gap:6px; }
.badge-ind { background:rgba(0,0,0,0.7); border:1px solid var(--line); padding:4px 6px; border-radius:4px; font-size:10px; font-weight:bold; }
.badge-watch { color:var(--green); border-color:var(--green); }
.badge-fav { color:var(--gold); border-color:var(--gold); }

/* Modals */
.overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:150; display:none; backdrop-filter:blur(3px); }
.modal-box { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--bg-panel); border:1px solid var(--line); border-radius:12px; z-index:200; display:none; box-shadow: 0 10px 40px rgba(0,0,0,0.8); overflow:hidden;}
.auth-modal { width:90%; max-width:360px; padding:24px; }
.movie-modal { width:90%; max-width:500px; }

/* Movie Popup styling */
.mm-banner { width:100%; height:250px; background:#111; position:relative; }
.mm-banner img { width:100%; height:100%; object-fit:cover; opacity:0.6; }
.mm-banner::after { content:''; position:absolute; bottom:0; left:0; right:0; height:120px; background:linear-gradient(transparent, var(--bg-panel)); }
.mm-close { position:absolute; top:12px; right:12px; background:rgba(0,0,0,0.5); border:1px solid var(--line); color:#fff; border-radius:50%; width:30px; height:30px; cursor:pointer; z-index:10; font-size:16px; line-height:1;}
.mm-content { padding: 24px; position:relative; margin-top:-60px; z-index:5; }
.mm-title { font-family:var(--font-display); font-size:28px; color:var(--gold); font-weight:bold; margin:0 0 6px 0; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
.mm-meta { font-family:var(--font-mono); font-size:12px; color:var(--text-dim); margin-bottom: 20px; }
.mm-note { font-size:13px; color:var(--text); margin-bottom: 24px; line-height:1.5; padding-left:12px; border-left:2px solid var(--gold-dim); }
.mm-actions { display:flex; flex-direction:column; gap:10px; }
.mm-btn { display:flex; align-items:center; justify-content:center; gap:8px; padding:12px; border-radius:6px; font-weight:600; font-size:13px; cursor:pointer; text-decoration:none; transition:all 0.15s; }
.mm-btn-watch { background:transparent; border:1px solid var(--line); color:var(--text); }
.mm-btn-watch.active { background:var(--green); border-color:var(--green); color:#111; }
.mm-btn-fav { background:transparent; border:1px solid var(--line); color:var(--text); }
.mm-btn-fav.active { background:var(--gold); border-color:var(--gold); color:#111; }
.mm-btn-insta { background:#1e1a22; border:1px solid var(--line); color:var(--text); }
.mm-btn-insta:hover { border-color:var(--gold-dim); }

.input-field { width:100%; margin-bottom:12px; background:var(--bg-card); border:1px solid var(--line); color:var(--text); padding:10px; border-radius:4px; font-size:13px; }
.btn-primary{font-family:var(--font-mono);font-size:12px;background:var(--gold);border:none;color:#1a1408; padding:10px 14px;border-radius:4px;cursor:pointer;font-weight:700;}
.btn-secondary{font-family:var(--font-mono);font-size:12px;background:transparent;border:1px solid var(--line); color:var(--text-dim);padding:10px 14px;border-radius:4px;cursor:pointer;}

.empty-msg{color:var(--text-dim);font-size:13px;padding:20px;text-align:center;}
.section-note{color:var(--text-dim);font-size:13px;line-height:1.6;margin-bottom:20px; background:var(--bg-panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;}
.loading{text-align:center;padding:60px;color:var(--text-dim);}
footer{text-align:center;padding:30px 20px 50px;color:var(--text-dim);font-size:11px;font-family:var(--font-mono);}
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo-container">
    <img src="https://fabulous-dolphin.staticdomains.app/6218bfc829c0772381d4ee6c296c531b.png" alt="Logo">
  </div>
  <div id="authContainer" class="auth-container">
    <!-- Populated by JS -->
  </div>
</div>

<div class="header">
  <h1>The Movie Vault</h1>
  <div class="subtitle">Where your movie life is organized.</div>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="statMovies">-</div><div class="stat-label">Movies</div></div>
    <div class="stat"><div class="stat-num" id="statSeries">-</div><div class="stat-label">Series</div></div>
    <div class="stat"><div class="stat-num" id="statUnid">-</div><div class="stat-label">Needs Review</div></div>
  </div>
</div>

<div class="tabs" id="tabs"></div>

<div class="app-container">
  <aside class="sidebar" id="sidebar"></aside>
  
  <main class="main-content">
    <div class="controls">
      <input type="text" id="searchBox" placeholder="Search title, language, genre...">
      <label class="chk"><input type="checkbox" id="hideWatched"> Hide watched</label>
      <button class="btn-add-manual" id="btnManualAdd" onclick="openManualAdd()">+ Add Entry</button>
    </div>
    <div id="main-view"><div class="loading">Loading your vault…</div></div>
  </main>
</div>

<!-- Modals & Overlays -->
<div class="overlay" id="modalOverlay" onclick="closeAllModals()"></div>

<!-- Movie Detail Popup -->
<div class="modal-box movie-modal" id="movieDetailModal">
  <button class="mm-close" onclick="closeAllModals()">&times;</button>
  <div class="mm-banner" id="mmBanner"></div>
  <div class="mm-content">
    <h2 class="mm-title" id="mmTitle">Title</h2>
    <div class="mm-meta" id="mmMeta">Year • Genre • Language</div>
    <div class="mm-note" id="mmNote" style="display:none;"></div>
    
    <div class="mm-actions">
      <button class="mm-btn mm-btn-watch" id="btnMmWatch" onclick="modalActionWatch()">Mark as Watched</button>
      <button class="mm-btn mm-btn-fav" id="btnMmFav" onclick="modalActionFav()">Add to Favorites</button>
      <a class="mm-btn mm-btn-insta" id="btnMmInsta" href="#" target="_blank" rel="noopener">View Instagram Post ↗</a>
    </div>
  </div>
</div>

<!-- Auth Modal (Sign In / Up) -->
<div class="modal-box auth-modal" id="loginModal">
  <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-bottom:15px;text-transform:uppercase;">Sign In / Sign Up</div>
  <input type="email" id="authEmail" class="input-field" placeholder="Email">
  <input type="password" id="authPass" class="input-field" placeholder="Password">
  <div id="loginStatus" style="font-size:11px;margin-bottom:12px;min-height:14px;"></div>
  <div style="display:flex; gap:8px;">
    <button class="btn-primary" onclick="handleLogin()" style="flex:1;">Sign In</button>
    <button class="btn-secondary" onclick="handleSignup()" style="flex:1;">Sign Up</button>
  </div>
</div>

<!-- Profile Setup Modal (First Time) -->
<div class="modal-box auth-modal" id="profileSetupModal">
  <div style="font-family:var(--font-mono);font-size:11px;color:var(--gold);margin-bottom:15px;text-transform:uppercase;">Setup Your Profile</div>
  <input type="text" id="setupUser" class="input-field" placeholder="Username (e.g. Cinephile99)">
  <input type="text" id="setupFirst" class="input-field" placeholder="First Name">
  <input type="text" id="setupLast" class="input-field" placeholder="Last Name">
  <button class="btn-primary" onclick="saveProfileSetup()" style="width:100%;">Complete Setup</button>
</div>

<footer>Data synced securely to Firebase. Only admins can edit the global list.</footer>

let DATA = null;
let USER_DATA = null;
let activeTab = 'movies';
let query = '';
let hideWatched = false;
let showFavsOnly = false;
let openResolveId = null;
let selectedGenreFilter = 'All'; 
let currentOpenMovie = null;

let db = null;
let docRef = null;
let auth = null;
let currentUser = null;
let isAdmin = false;

async function initFirebase(){
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const { getFirestore, doc, getDoc, setDoc, updateDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
  const firebaseConfig = {
    apiKey: "AIzaSyCENX28G1ilQiZiLwjCY3AF7oPCelj9UsQ",
    authDomain: "movie-collections-d9103.firebaseapp.com",
    projectId: "movie-collections-d9103",
    storageBucket: "movie-collections-d9103.firebasestorage.app",
    messagingSenderId: "415085699584",
    appId: "1:415085699584:web:c98f6eb2fd3ea061c7eee5",
    measurementId: "G-Y0FS0S4XT3"
  };
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  docRef = doc(db, "vault", "main");
  auth = getAuth(app);
  window._fs = { getDoc, setDoc, updateDoc, doc };
  window._auth = { signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged };
  
  onAuthStateChanged(auth, async (user)=>{
    currentUser = user;
    isAdmin = !!user && user.email === ADMIN_EMAIL;
    if(user) {
      const uRef = window._fs.doc(db, 'users', user.uid);
      const uSnap = await window._fs.getDoc(uRef);
      if(!uSnap.exists()) {
        document.getElementById('modalOverlay').style.display = 'block';
        document.getElementById('profileSetupModal').style.display = 'block';
      } else {
        USER_DATA = uSnap.data();
        if(!USER_DATA.favorites) USER_DATA.favorites = [];
      }
    } else {
      USER_DATA = null;
      showFavsOnly = false;
    }
    updateAuthUI();
    render();
  });
}

function updateAuthUI(){
  const container = document.getElementById('authContainer');
  if(currentUser && USER_DATA) {
    container.innerHTML = `
      <a class="auth-link fav-toggle ${showFavsOnly?'active':''}" onclick="toggleFavView()">★ Favorites</a>
      <a class="auth-link" onclick="handleLogout()">Sign Out</a>
      <div class="user-badge">${USER_DATA.username}</div>
    `;
    const btnAdd = document.getElementById('btnManualAdd');
    btnAdd.style.display = 'inline-block';
    btnAdd.textContent = isAdmin ? '+ Add Entry' : '+ Suggest Entry';
  } else {
    container.innerHTML = `<a class="auth-link" onclick="openLogin()">Sign In / Sign Up</a>`;
    document.getElementById('btnManualAdd').style.display = 'none';
  }
}

function openLogin() {
  document.getElementById('modalOverlay').style.display = 'block';
  document.getElementById('loginModal').style.display = 'block';
}
function closeAllModals() {
  document.getElementById('modalOverlay').style.display = 'none';
  document.querySelectorAll('.modal-box').forEach(m => m.style.display = 'none');
  currentOpenMovie = null;
}

async function handleLogin(){
  const e = document.getElementById('authEmail').value.trim(), p = document.getElementById('authPass').value;
  try{ await window._fs.signInWithEmailAndPassword(auth, e, p); closeAllModals(); }
  catch(err){ document.getElementById('loginStatus').innerHTML = '<span style="color:red">Login failed</span>'; }
}

async function handleSignup(){
  const e = document.getElementById('authEmail').value.trim(), p = document.getElementById('authPass').value;
  try{ await window._fs.createUserWithEmailAndPassword(auth, e, p); closeAllModals(); }
  catch(err){ document.getElementById('loginStatus').innerHTML = `<span style="color:red">${err.message}</span>`; }
}

async function saveProfileSetup(){
  const user = document.getElementById('setupUser').value.trim();
  if(!user) return alert("Username required");
  USER_DATA = { 
    username: user, 
    firstName: document.getElementById('setupFirst').value.trim(), 
    lastName: document.getElementById('setupLast').value.trim(),
    watched: [], favorites: []
  };
  await window._fs.setDoc(window._fs.doc(db, 'users', currentUser.uid), USER_DATA);
  closeAllModals();
  updateAuthUI();
  render();
}

async function handleLogout(){ await window._fs.signOut(auth); }

function toggleFavView() {
  if(!currentUser) return openLogin();
  showFavsOnly = !showFavsOnly;
  updateAuthUI();
  render();
}

async function loadData(){
  const main = document.getElementById('main-view');
  try{
    await initFirebase();
    const snap = await window._fs.getDoc(docRef);
    if(snap.exists()){
      DATA = snap.data();
      if(!DATA.suggestions) DATA.suggestions = [];
    } else {
      DATA = JSON.parse(JSON.stringify(SEED));
      if(isAdmin) await window._fs.setDoc(docRef, DATA);
    }
  }catch(e){
    DATA = JSON.parse(JSON.stringify(SEED));
  }
  render();
}

async function saveGlobal(){
  if(!currentUser) return;
  try{ await window._fs.setDoc(docRef, DATA); }catch(e){}
}
async function saveUserData(){
  if(!currentUser || !USER_DATA) return;
  try{ await window._fs.updateDoc(window._fs.doc(db, 'users', currentUser.uid), {watched: USER_DATA.watched, favorites: USER_DATA.favorites}); }catch(e){}
}

function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function allGenres(){
  const g = new Set();
  if(activeTab === 'movies') DATA.movies.forEach(m=>g.add(m.genre));
  if(activeTab === 'series') DATA.series.forEach(s=>g.add(s.genre));
  return [...g].filter(Boolean).sort();
}

function isWatched(id) { return USER_DATA && USER_DATA.watched && USER_DATA.watched.includes(id); }
function isFav(id) { return USER_DATA && USER_DATA.favorites && USER_DATA.favorites.includes(id); }

function renderTabs(){
  const tabs = [{id:'movies', label:'Movies'}, {id:'series', label:'Series'}];
  if(isAdmin && DATA.unidentified) tabs.push({id:'unidentified', label:'Needs Review'});
  if(isAdmin && DATA.suggestions && DATA.suggestions.length>0) tabs.push({id:'suggestions', label:`Suggestions (${DATA.suggestions.length})`});
  if((activeTab==='unidentified' || activeTab==='suggestions') && !isAdmin) activeTab='movies';
  
  const el = document.getElementById('tabs');
  el.innerHTML = tabs.map(t => `<button class="tab-btn ${t.id===activeTab?'active':''} ${t.id==='suggestions'?'notify':''}" data-tab="${t.id}">${t.label}</button>`).join('');
  el.querySelectorAll('.tab-btn').forEach(btn=>{ btn.addEventListener('click', ()=>{ activeTab = btn.dataset.tab; selectedGenreFilter='All'; render(); }); });
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  if(activeTab === 'unidentified' || activeTab === 'suggestions') { sidebar.style.display = 'none'; return; }
  sidebar.style.display = 'block';
  const genres = allGenres();
  let html = `<div class="sidebar-title">Filter by Genre</div><ul class="sidebar-list">`;
  html += `<li class="${selectedGenreFilter==='All'?'active':''}" onclick="selectedGenreFilter='All'; render();">All Genres</li>`;
  genres.forEach(g => { html += `<li class="${selectedGenreFilter===g?'active':''}" onclick="selectedGenreFilter='${g}'; render();">${g}</li>`; });
  sidebar.innerHTML = html + `</ul>`;
}

async function openMovieModal(id, type) {
  currentOpenMovie = (type==='movie' ? DATA.movies : DATA.series).find(x=>x.id===id);
  if(!currentOpenMovie) return;
  
  // Auto-fetch poster if missing
  if(!currentOpenMovie.poster || currentOpenMovie.poster === 'N/A') {
    try {
      const res = await fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(currentOpenMovie.title)}&apikey=${OMDB_KEY}`);
      const data = await res.json();
      if(data.Poster && data.Poster !== 'N/A') {
        currentOpenMovie.poster = data.Poster;
        if(isAdmin) saveGlobal(); // save for everyone if admin triggers it
        render(); // re-render grid underneath
      } else {
        currentOpenMovie.poster = 'NONE';
      }
    } catch(e) {}
  }

  document.getElementById('mmTitle').textContent = currentOpenMovie.title;
  document.getElementById('mmMeta').textContent = `${currentOpenMovie.year||'Year'} • ${currentOpenMovie.genre||'Genre'} • ${currentOpenMovie.language||'Lang'}`;
  
  const n = document.getElementById('mmNote');
  if(currentOpenMovie.note) { n.style.display='block'; n.textContent = currentOpenMovie.note; } else n.style.display='none';
  
  const banner = document.getElementById('mmBanner');
  banner.innerHTML = (currentOpenMovie.poster && currentOpenMovie.poster!=='NONE') ? `<img src="${currentOpenMovie.poster}">` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#444;">No Poster</div>`;
  
  const btnInsta = document.getElementById('btnMmInsta');
  if(currentOpenMovie.url) { btnInsta.style.display='flex'; btnInsta.href = currentOpenMovie.url; } else { btnInsta.style.display='none'; }
  
  updateModalButtons();
  document.getElementById('modalOverlay').style.display = 'block';
  document.getElementById('movieDetailModal').style.display = 'block';
}

function updateModalButtons() {
  if(!currentOpenMovie) return;
  const bw = document.getElementById('btnMmWatch');
  const bf = document.getElementById('btnMmFav');
  if(!currentUser) {
    bw.innerHTML = 'Sign in to track watches'; bw.className = 'mm-btn mm-btn-watch';
    bf.style.display = 'none';
    return;
  }
  bf.style.display = 'flex';
  const watched = isWatched(currentOpenMovie.id);
  const fav = isFav(currentOpenMovie.id);
  bw.className = 'mm-btn mm-btn-watch ' + (watched ? 'active':'');
  bw.innerHTML = watched ? '✓ Watched' : 'Mark as Watched';
  bf.className = 'mm-btn mm-btn-fav ' + (fav ? 'active':'');
  bf.innerHTML = fav ? '★ Favorited' : 'Add to Favorites';
}

function modalActionWatch() {
  if(!currentUser) return openLogin();
  const id = currentOpenMovie.id;
  const idx = USER_DATA.watched.indexOf(id);
  if(idx > -1) USER_DATA.watched.splice(idx,1); else USER_DATA.watched.push(id);
  saveUserData(); updateModalButtons(); render();
}

function modalActionFav() {
  if(!currentUser) return openLogin();
  const id = currentOpenMovie.id;
  const idx = USER_DATA.favorites.indexOf(id);
  if(idx > -1) USER_DATA.favorites.splice(idx,1); else USER_DATA.favorites.push(id);
  saveUserData(); updateModalButtons(); render();
}

function movieCard(m, type){
  const w = isWatched(m.id);
  const f = isFav(m.id);
  const posterHtml = m.poster && m.poster !== 'N/A' && m.poster !== 'NONE'
    ? `<img src="${m.poster}" class="card-poster" loading="lazy">` 
    : `<div class="card-poster" style="display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:11px;">No Poster</div>`;

  let inds = '';
  if(w) inds += `<div class="badge-ind badge-watch">✓</div>`;
  if(f) inds += `<div class="badge-ind badge-fav">★</div>`;

  return `<div class="card ${w?'watched-fade':''}" onclick="openMovieModal('${m.id}','${type}')">
      ${posterHtml}
      ${inds ? `<div class="card-indicators">${inds}</div>` : ''}
      <div class="card-body">
        <div class="card-title">${m.title}</div>
        <div class="card-year">${m.year? m.year+' • ':''}${m.subgenre||''}</div>
      </div>
    </div>`;
}

function renderMovies(){
  const main = document.getElementById('main-view');
  let filtered = DATA.movies.filter(m => matchesQuery(m, ['title','genre','language','subgenre','time']));
  if(hideWatched) filtered = filtered.filter(m=>!isWatched(m.id));
  if(showFavsOnly) filtered = filtered.filter(m=>isFav(m.id));
  if(selectedGenreFilter !== 'All') filtered = filtered.filter(m=>m.genre === selectedGenreFilter);
  
  if(filtered.length===0){ main.innerHTML = '<div class="empty-msg">No matches.</div>'; return; }

  const genres = [...new Set(filtered.map(m=>m.genre))].sort();
  let html = '';
  genres.forEach(genre=>{
    const genreMovies = filtered.filter(m=>m.genre===genre);
    html += `<div class="genre-section"><div class="genre-title">${genre} <span class="count">${genreMovies.length}</span></div>`;
    const times = [...new Set(genreMovies.map(m=>m.time||'Unspecified'))].sort();
    times.forEach(time=>{
      const timeMovies = genreMovies.filter(m=>(m.time||'Unspecified')===time);
      html += `<div class="time-block"><div class="time-title">${time}</div><div class="card-grid">`;
      timeMovies.forEach(m=>{ html += movieCard(m,'movie'); });
      html += `</div></div>`;
    });
    html += `</div>`;
  });
  main.innerHTML = html;
}

function renderSeries(){
  const main = document.getElementById('main-view');
  let filtered = DATA.series.filter(s => matchesQuery(s, ['title','genre','language','subgenre']));
  if(hideWatched) filtered = filtered.filter(s=>!isWatched(s.id));
  if(showFavsOnly) filtered = filtered.filter(s=>isFav(s.id));
  if(selectedGenreFilter !== 'All') filtered = filtered.filter(m=>m.genre === selectedGenreFilter);

  let html = '';
  if(filtered.length===0){ html += '<div class="empty-msg">No matches.</div>'; main.innerHTML = html; return; }
  
  const genres = [...new Set(filtered.map(s=>s.genre))].sort();
  genres.forEach(genre=>{
    const genreSeries = filtered.filter(s=>s.genre===genre);
    html += `<div class="genre-section"><div class="genre-title">${genre} <span class="count">${genreSeries.length}</span></div><div class="card-grid">`;
    genreSeries.forEach(s=>{ html += movieCard(s,'series'); });
    html += `</div></div>`;
  });
  main.innerHTML = html;
}

function render(){
  document.getElementById('statMovies').textContent = DATA?DATA.movies.length:0;
  document.getElementById('statSeries').textContent = DATA?DATA.series.length:0;
  
  renderTabs();
  renderSidebar();
  if(activeTab==='movies') renderMovies();
  else if(activeTab==='series') renderSeries();
}

document.getElementById('searchBox').addEventListener('input', (e)=>{ query = e.target.value; render(); });
document.getElementById('hideWatched').addEventListener('change', (e)=>{ hideWatched = e.target.checked; render(); });

loadData();
</script>
